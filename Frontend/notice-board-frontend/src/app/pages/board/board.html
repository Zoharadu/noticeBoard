<div class="layout">
  <aside class="side card">
    <h3>תפריט</h3>

    <a class="link" routerLink="/board">לוח מודעות</a>
    <a class="link" routerLink="/admin">ניהול (CRUD)</a>

    <button class="btn btn-ghost" (click)="logout()">יציאה</button>
  </aside>

  <main class="main card">
    <h2>לוח מודעות</h2>

    <div class="grid" *ngIf="!loading">
      <div class="notice" *ngFor="let n of notices">
        <div class="top">
          <h3>{{ n.title }}</h3>
          <span class="date">{{ n.createdAt | date:'dd/MM/yyyy' }}</span>
        </div>

        <p class="content">{{ n.content }}</p>

        <div class="meta" *ngIf="n.location?.address">
          📍 {{ n.location.address }}
        </div>
      </div>
    </div>
  </main>
</div>
